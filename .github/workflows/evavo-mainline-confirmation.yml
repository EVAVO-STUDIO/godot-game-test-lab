name: EVAVO mainline confirmation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to validate
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Confirm Godot lab source and policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 12

    concurrency:
      group: evavo-mainline-${{ inputs.expected_sha }}-godot-lab-source
      cancel-in-progress: false

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_sha" >&2
            exit 1
          fi
          if [[ "$REQUEST_SOURCE" != "evavo-development-studio" ]]; then
            echo "Unsupported request_source" >&2
            exit 1
          fi

      - name: Check out exact mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but checked out $ACTUAL_SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install bounded development dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -e ".[dev]"

      - name: Compile source, scripts and tests
        run: python -m compileall src scripts tests

      - name: Run Ruff
        run: python -m ruff check src scripts tests

      - name: Parse shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts containers -type f -name '*.sh' -print0)

      - name: Run tests
        run: python -m pytest

      - name: Record source-only truth boundary
        shell: bash
        run: |
          printf '%s\n' \
            '### Godot Game Test Lab source confirmation' \
            '' \
            '- Python compile, lint, shell parsing and tests: requested' \
            '- Reusable caller-context workflow contract: source-tested only' \
            '- Profile schema 2.0 and journey mutation contract: source-tested only' \
            '- Windows runner probe: not performed' \
            '- Linux Docker image and rendered fixture: not performed' \
            '- Godot executable identity: not performed' \
            '- Godot .NET editor and SDK identity: not performed' \
            '- Target project import, boot, export or movie: not performed' \
            '- Keyboard, mouse or synthetic joypad journey: not performed' \
            '- Physical controller or human UX review: not performed' \
            >> "$GITHUB_STEP_SUMMARY"
