name: Apply native Godot QA hardening

on:
  push:
    branches:
      - main
    paths:
      - ".evavo/bootstrap/native-qa-hardening.ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-native-godot-qa-hardening-main
  cancel-in-progress: true

jobs:
  apply:
    name: Validate and publish bounded native QA hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact triggering main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Reconstruct, verify and apply exact hardening payload
        shell: bash
        run: |
          set -euo pipefail
          cat .evavo/bootstrap/native-qa-hardening-{00..08}.b64 \
            | base64 --decode > "${RUNNER_TEMP}/native-qa-hardening.tar.gz"
          printf '%s  %s\n' \
            'c48c981b66ee2369087b562696edb29e3f2888ee3d1e58e7b5b8e6fcf4280451' \
            "${RUNNER_TEMP}/native-qa-hardening.tar.gz" \
            | sha256sum --check --strict
          PAYLOAD="${RUNNER_TEMP}/native-qa-hardening.tar.gz" python - <<'PY'
          from __future__ import annotations

          import os
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          expected = {
              ".gitignore",
              "AGENTS.md",
              "CLAUDE.md",
              "README.md",
              "docs/NATIVE_WINDOWS_AGENT_QA.md",
              "examples/native-agent-qa.profile.json",
              "schemas/native-agent-qa-profile.schema.json",
              "scripts/Invoke-GodotLabNativeAgentQA.ps1",
              "src/godot_game_test_lab/native_qa.py",
              "src/godot_game_test_lab/native_qa_common.py",
              "src/godot_game_test_lab/native_qa_evidence.py",
              "src/godot_game_test_lab/native_qa_profile.py",
              "src/godot_game_test_lab/native_qa_runner.py",
              "tests/test_native_qa.py",
              "tests/test_native_qa_hardening.py",
          }
          payload = Path(os.environ["PAYLOAD"])
          repository = Path.cwd().resolve(strict=True)
          total = 0
          observed: set[str] = set()
          with tarfile.open(payload, mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  pure = PurePosixPath(member.name)
                  if (
                      pure.is_absolute()
                      or any(part in {"", ".", ".."} for part in pure.parts)
                      or not member.isfile()
                      or member.size < 0
                      or member.size > 2 * 1024 * 1024
                  ):
                      raise SystemExit(f"unsafe payload member: {member.name}")
                  if member.name in observed:
                      raise SystemExit(f"duplicate payload member: {member.name}")
                  observed.add(member.name)
                  total += member.size
              if observed != expected:
                  missing = sorted(expected - observed)
                  extra = sorted(observed - expected)
                  raise SystemExit(f"payload member mismatch; missing={missing}; extra={extra}")
              if total > 2 * 1024 * 1024:
                  raise SystemExit("payload expanded-byte limit exceeded")
              for member in members:
                  destination = repository.joinpath(*PurePosixPath(member.name).parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"payload member could not be read: {member.name}")
                  temporary = destination.with_name(destination.name + ".evavo-tmp")
                  with source, temporary.open("xb") as output:
                      shutil.copyfileobj(source, output, length=1024 * 1024)
                  temporary.replace(destination)
          PY
          rm -f .evavo/bootstrap/native-qa-hardening-*.b64
          rm -f .evavo/bootstrap/native-qa-hardening.ready
          rmdir .evavo/bootstrap 2>/dev/null || true
          rm -f .github/workflows/apply-native-qa-hardening.yml

      - name: Verify repository-owned toolchain authority
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Install pinned development dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Compile, lint, parse and test complete source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts containers -type f -name '*.sh' -print0)
          pwsh -NoLogo -NoProfile -NonInteractive -Command \
            '$null = [scriptblock]::Create((Get-Content -Raw "scripts/Invoke-GodotLabNativeAgentQA.ps1"))'
          python - <<'PY'
          import json
          from pathlib import Path

          json.loads(Path("schemas/native-agent-qa-profile.schema.json").read_text())
          json.loads(Path("examples/native-agent-qa.profile.json").read_text())
          PY
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Clean generated files and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name '*.pyc' -delete
          test ! -e .github/workflows/apply-native-qa-hardening.yml
          test ! -d .evavo/bootstrap
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -E '^(\?\?| M|M |A | D|D ) (dist|\.pytest_cache|\.ruff_cache|src/.*\.egg-info|.*__pycache__|.*\.pyc)' || true)"

      - name: Commit validated hardening directly to main
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Remote main drifted from ${EXPECTED_HEAD} to ${remote_head}." >&2
            exit 1
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "fix(qa): harden exact native Godot evidence runs"
          git push origin HEAD:main

      - name: Retain failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/bootstrap-diagnostics
          {
            printf 'trigger_sha=%s\n' "${GITHUB_SHA}"
            printf 'utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n== status ==\n'
            git status --short --untracked-files=all
            printf '\n== diff check ==\n'
            git diff --check
            printf '\n== toolchain ==\n'
            python scripts/check_repository_toolchain.py --skip-runtime
            printf '\n== compile ==\n'
            python -m compileall -q src scripts tests
            printf '\n== ruff ==\n'
            python -m ruff check src scripts tests
            printf '\n== focused tests ==\n'
            python -m pytest -q tests/test_native_qa.py tests/test_native_qa_hardening.py
          } > artifacts/bootstrap-diagnostics/diagnostic.txt 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-qa-hardening-${{ github.sha }}
          path: artifacts/bootstrap-diagnostics
          if-no-files-found: error
          retention-days: 7
