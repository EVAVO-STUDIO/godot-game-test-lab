name: Capability manifest

on:
  push:
    branches:
      - main
    paths:
      - evavo.capabilities.json
      - evavo.reliability.json
      - pyproject.toml
      - schemas/evavo.repository-capabilities.schema.json
      - schemas/localization-godot-plural-testlab-request.v1.schema.json
      - schemas/evavo-godot-plural-localization-test-lab-report.v1.schema.json
      - schemas/localization-godot-stable-id-application-bundle.v1.schema.json
      - schemas/evavo-godot-stable-id-bundle-admission-report.v1.schema.json
      - scripts/check_repository_toolchain.py
      - scripts/check_repository_toolchain_core.py
      - scripts/_repository_toolchain_core_base.py
      - scripts/test_repository_toolchain.py
      - scripts/_repository_toolchain_tests_base.py
      - scripts/check_evavo_capability_manifest.py
      - scripts/check_evavo_capability_manifest_legacy.py
      - scripts/Invoke-GodotPluralLocalizationValidation.ps1
      - src/godot_game_test_lab/localization_plural.py
      - src/godot_game_test_lab/localization_plural_safe.py
      - src/godot_game_test_lab/localization_plural_runtime.py
      - src/godot_game_test_lab/localization_plural_runtime_cli.py
      - src/godot_game_test_lab/localization_stable_id_bundle.py
      - src/godot_game_test_lab/localization_stable_id_bundle_cli.py
      - docs/CAPABILITY_MANIFEST.md
      - docs/LOCALIZATION_PLURAL_RUNTIME_VALIDATION.md
      - docs/LOCALIZATION_STABLE_ID_BUNDLE_ADMISSION.md
      - tests/test_capability_manifest_contract.py
      - tests/test_mcp_dependency_contract.py
      - tests/test_localization_plural*.py
      - tests/test_localization_stable_id_bundle*.py
      - tests/test_workflow_inventory.py
      - .github/workflows/capability-manifest.yml
  pull_request:
    paths:
      - evavo.capabilities.json
      - evavo.reliability.json
      - pyproject.toml
      - schemas/evavo.repository-capabilities.schema.json
      - schemas/localization-godot-plural-testlab-request.v1.schema.json
      - schemas/evavo-godot-plural-localization-test-lab-report.v1.schema.json
      - schemas/localization-godot-stable-id-application-bundle.v1.schema.json
      - schemas/evavo-godot-stable-id-bundle-admission-report.v1.schema.json
      - scripts/check_repository_toolchain.py
      - scripts/check_repository_toolchain_core.py
      - scripts/_repository_toolchain_core_base.py
      - scripts/test_repository_toolchain.py
      - scripts/_repository_toolchain_tests_base.py
      - scripts/check_evavo_capability_manifest.py
      - scripts/check_evavo_capability_manifest_legacy.py
      - scripts/Invoke-GodotPluralLocalizationValidation.ps1
      - src/godot_game_test_lab/localization_plural.py
      - src/godot_game_test_lab/localization_plural_safe.py
      - src/godot_game_test_lab/localization_plural_runtime.py
      - src/godot_game_test_lab/localization_plural_runtime_cli.py
      - src/godot_game_test_lab/localization_stable_id_bundle.py
      - src/godot_game_test_lab/localization_stable_id_bundle_cli.py
      - docs/CAPABILITY_MANIFEST.md
      - docs/LOCALIZATION_PLURAL_RUNTIME_VALIDATION.md
      - docs/LOCALIZATION_STABLE_ID_BUNDLE_ADMISSION.md
      - tests/test_capability_manifest_contract.py
      - tests/test_mcp_dependency_contract.py
      - tests/test_localization_plural*.py
      - tests/test_localization_stable_id_bundle*.py
      - tests/test_workflow_inventory.py
      - .github/workflows/capability-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Verify repository toolchain authority
        run: |
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Validate capability contract against live source
        run: python scripts/check_evavo_capability_manifest.py

      - name: Compile capability-bound Python
        run: python -m compileall -q src scripts tests

      - name: Parse guarded Windows wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "scripts/Invoke-GodotPluralLocalizationValidation.ps1"
          $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $path))

      - name: Install pinned test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Run capability, dependency and localization regressions
        run: |
          python -m pytest -q \
            tests/test_capability_manifest_contract.py \
            tests/test_mcp_dependency_contract.py \
            tests/test_localization_plural.py \
            tests/test_localization_plural_command_guard.py \
            tests/test_localization_plural_contract_surface.py \
            tests/test_localization_plural_guarded.py \
            tests/test_localization_plural_runtime_facade.py \
            tests/test_localization_plural_windows_wrapper.py \
            tests/test_localization_stable_id_bundle.py \
            tests/test_localization_stable_id_bundle_contract_surface.py \
            tests/test_workflow_inventory.py

      - name: Verify source remained clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pytest_cache .ruff_cache
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
