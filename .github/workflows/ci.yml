name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate exact Godot lab source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Verify source toolchain authority
        run: python scripts/check_repository_toolchain.py

      - name: Run adversarial toolchain fixtures
        run: python scripts/test_repository_toolchain.py

      - name: Install bounded review-first dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Compile source, scripts and tests
        run: python -m compileall -q src scripts tests

      - name: Run Ruff
        run: python -m ruff check src scripts tests

      - name: Parse shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts containers -type f -name '*.sh' -print0)

      - name: Run tests
        run: python -m pytest

      - name: Build wheel without dependency resolution
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Remove generated outputs and verify clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
