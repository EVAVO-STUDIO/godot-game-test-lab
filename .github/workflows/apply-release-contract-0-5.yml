name: Finalize Godot Lab 0.5 release contract

on:
  push:
    branches:
      - main
    paths:
      - ".evavo/release-contract-0-5.ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-godot-lab-release-contract-0-5
  cancel-in-progress: true

jobs:
  finalize:
    name: Validate and publish the complete 0.5 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact triggering main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Align all repository-owned version authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          checker = Path("scripts/check_repository_toolchain.py")
          source = checker.read_text(encoding="utf-8")
          if source.count('"0.4.0"') != 2:
              raise SystemExit("toolchain version anchors were not exactly the expected pair")
          source = source.replace('"0.4.0"', '"0.5.0"')

          package_anchor = '    if project.get("requires-python") != ">=3.11":\n'
          package_check = (
              '    package_source = read_text('
              '"src/godot_game_test_lab/__init__.py", 64_000)\n'
              '    if \'__version__ = "0.5.0"\' not in package_source:\n'
              '        fail("package runtime version changed")\n\n'
              + package_anchor
          )
          if source.count(package_anchor) != 1:
              raise SystemExit("package-version checker anchor was not unique")
          source = source.replace(package_anchor, package_check)

          schema_anchor = (
              '        fail("repository-owned reliability schema identity changed")\n\n'
              '    dockerfile = require_tokens(\n'
          )
          schema_check = (
              '        fail("repository-owned reliability schema identity changed")\n'
              '    if (\n'
              '        schema.get("properties", {})\n'
              '        .get("toolVersion", {})\n'
              '        .get("const")\n'
              '        != "0.5.0"\n'
              '    ):\n'
              '        fail("repository-owned reliability tool version changed")\n\n'
              '    dockerfile = require_tokens(\n'
          )
          if source.count(schema_anchor) != 1:
              raise SystemExit("schema-version checker anchor was not unique")
          checker.write_text(
              source.replace(schema_anchor, schema_check),
              encoding="utf-8",
              newline="\n",
          )

          fixture = Path("scripts/test_repository_toolchain.py")
          fixture_source = fixture.read_text(encoding="utf-8")
          file_anchor = '    "scripts/check_repository_toolchain.py",\n]\n'
          file_replacement = (
              '    "scripts/check_repository_toolchain.py",\n'
              '    "src/godot_game_test_lab/__init__.py",\n'
              ']\n'
          )
          if fixture_source.count(file_anchor) != 1:
              raise SystemExit("toolchain fixture file anchor was not unique")
          fixture_source = fixture_source.replace(file_anchor, file_replacement)

          exercise_anchor = (
              '    exercise(\n'
              '        lambda root: (root / ".python-version").write_text('
              '"3.11.14\\n", encoding="utf-8"),\n'
          )
          exercise = (
              '    exercise(\n'
              '        lambda root: mutate_text(\n'
              '            root,\n'
              '            "src/godot_game_test_lab/__init__.py",\n'
              '            lambda value: value.replace(\n'
              '                \'__version__ = "0.5.0"\',\n'
              '                \'__version__ = "0.5.1"\',\n'
              '            ),\n'
              '        ),\n'
              '        "package version drift",\n'
              '    )\n'
              + exercise_anchor
          )
          if fixture_source.count(exercise_anchor) != 1:
              raise SystemExit("toolchain version-drift fixture anchor was not unique")
          fixture.write_text(
              fixture_source.replace(exercise_anchor, exercise),
              encoding="utf-8",
              newline="\n",
          )

          schema_path = Path("schemas/repository-owned-reliability-profile.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          observed = schema["properties"]["toolVersion"].get("const")
          if observed != "0.4.0":
              raise SystemExit(f"unexpected reliability schema tool version: {observed}")
          schema["properties"]["toolVersion"]["const"] = "0.5.0"
          schema_path.write_text(
              json.dumps(schema, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          rm -f .evavo/release-contract-0-5.ready
          rm -f .evavo/release-contract-0-5-diagnostic.txt
          rm -f .github/workflows/apply-release-contract-0-5.yml

      - name: Verify repository-owned toolchain authority
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Install pinned development dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Compile, lint, parse and test the complete release
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts containers -type f -name '*.sh' -print0)
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Clean generated files and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name '*.pyc' -delete
          test ! -e .github/workflows/apply-release-contract-0-5.yml
          test ! -e .evavo/release-contract-0-5.ready
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -E '^(\?\?| M|M |A | D|D ) (dist|\.pytest_cache|\.ruff_cache|src/.*\.egg-info|.*__pycache__|.*\.pyc)' || true)"

      - name: Commit the validated release contract directly to main
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Remote main drifted from ${EXPECTED_HEAD} to ${remote_head}." >&2
            exit 1
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "chore(release): complete Godot lab 0.5.0 contract"
          git push origin HEAD:main

      - name: Retain bounded failure diagnostics
        if: failure()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set +e
          diagnostic='.evavo/release-contract-0-5-diagnostic.txt'
          mkdir -p .evavo
          {
            printf 'trigger_sha=%s\n' "${EXPECTED_HEAD}"
            printf 'utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n== status ==\n'
            git status --short --untracked-files=all
            printf '\n== diff check ==\n'
            git diff --check
            printf '\n== toolchain ==\n'
            python scripts/check_repository_toolchain.py --skip-runtime
            printf '\n== compile ==\n'
            python -m compileall -q src scripts tests
            printf '\n== ruff ==\n'
            python -m ruff check src scripts tests
            printf '\n== release tests ==\n'
            python -m pytest -q tests/test_release_contract.py tests/test_cli.py
            printf '\n== full tests ==\n'
            python -m pytest -q
          } > "${diagnostic}" 2>&1
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Not publishing diagnostics because main drifted to ${remote_head}."
            exit 0
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add "${diagnostic}"
          git commit -m "diagnose(release): retain Godot lab 0.5 contract failure"
          git push origin HEAD:main
