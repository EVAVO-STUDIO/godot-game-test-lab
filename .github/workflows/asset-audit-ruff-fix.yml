name: Print exact asset-audit Ruff fix

on:
  pull_request:
    paths:
      - ".github/workflows/asset-audit-ruff-fix.yml"
      - "src/godot_game_test_lab/asset_audit.py"
      - "src/godot_game_test_lab/asset_audit_contract.py"
      - "tests/test_asset_audit.py"
      - "tests/test_asset_audit_authority.py"

permissions:
  contents: read

jobs:
  print-fix:
    name: Print exact Ruff 0.9.0 patch
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11.15"
          check-latest: false

      - name: Install exact development tools
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Apply exact Ruff fixes in the disposable checkout
        run: python -m ruff check --fix src scripts tests

      - name: Print the authoritative patch
        run: |
          git diff -- \
            src/godot_game_test_lab/asset_audit.py \
            src/godot_game_test_lab/asset_audit_contract.py \
            tests/test_asset_audit.py \
            tests/test_asset_audit_authority.py
