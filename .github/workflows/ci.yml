name: Recover complete managed sandbox release tree

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-managed-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover-source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/managed-sandbox-release-0.7')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the trusted same-repository branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reconstruct, verify and apply the exact release overlay
        shell: bash
        env:
          EXPECTED_ARCHIVE_BYTES: '114059'
          EXPECTED_ARCHIVE_SHA256: c6a6ed63d7fe8078591430c2a0fb93c066bf37b3e5347f8c5744cd2d2891ce51
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import stat
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve(strict=True)
          manifest_path = root / '.evavo/bootstrap/managed-sandbox-0.7.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          records = manifest.get('files')
          if manifest.get('schemaVersion') != '1.0' or manifest.get('releaseVersion') != '0.7.0':
              raise SystemExit('unexpected release manifest identity')
          if not isinstance(records, list) or len(records) != 52:
              raise SystemExit('unexpected release manifest inventory')

          expected: dict[str, dict[str, object]] = {}
          for record in records:
              if not isinstance(record, dict) or not isinstance(record.get('path'), str):
                  raise SystemExit('invalid release file record')
              name = record['path']
              pure = PurePosixPath(name)
              if name in expected or pure.is_absolute() or any(part in {'', '.', '..'} for part in pure.parts):
                  raise SystemExit(f'unsafe or duplicate manifest path: {name}')
              expected[name] = record

          parts: list[str] = []
          for number in range(22):
              relative = Path(f'.evavo/bootstrap/managed-sandbox-0.7-small-{number:03d}.b64')
              path = root / relative
              if path.is_symlink() or not path.is_file() or path.resolve(strict=True) != path.absolute():
                  raise SystemExit(f'missing or unsafe release segment: {relative}')
              compact = ''.join(path.read_text(encoding='ascii').split())
              if not compact or re.fullmatch(r'[A-Za-z0-9+/]*={0,2}', compact) is None:
                  raise SystemExit(f'invalid Base64 release segment: {relative}')
              if number < 21 and '=' in compact:
                  raise SystemExit(f'non-final release segment contains padding: {relative}')
              parts.append(compact)

          archive_bytes = base64.b64decode(''.join(parts), validate=True)
          actual_sha = hashlib.sha256(archive_bytes).hexdigest()
          expected_bytes = int(os.environ['EXPECTED_ARCHIVE_BYTES'])
          expected_sha = os.environ['EXPECTED_ARCHIVE_SHA256']
          if len(archive_bytes) != expected_bytes or actual_sha != expected_sha:
              raise SystemExit(
                  f'archive identity mismatch: bytes={len(archive_bytes)} sha256={actual_sha}'
              )
          if manifest.get('archiveBytes') != len(archive_bytes) or manifest.get('archiveSha256') != actual_sha:
              raise SystemExit('manifest archive identity mismatch')

          archive_path = Path(os.environ['RUNNER_TEMP']) / 'managed-sandbox-0.7.tar.gz'
          archive_path.write_bytes(archive_bytes)
          overlay = root / 'recovered-overlay'
          overlay.mkdir(mode=0o700)

          observed: set[str] = set()
          expanded = 0
          with tarfile.open(archive_path, mode='r:gz') as archive:
              members = archive.getmembers()
              if len(members) != len(expected):
                  raise SystemExit('archive member count mismatch')
              for member in members:
                  pure = PurePosixPath(member.name)
                  if (
                      pure.is_absolute()
                      or any(part in {'', '.', '..'} for part in pure.parts)
                      or not member.isfile()
                      or member.name in observed
                      or member.name not in expected
                      or member.size != expected[member.name].get('bytes')
                      or member.size < 0
                      or member.size > 4 * 1024 * 1024
                  ):
                      raise SystemExit(f'unsafe release archive member: {member.name}')
                  observed.add(member.name)
                  expanded += member.size
              if observed != set(expected) or expanded > 8 * 1024 * 1024:
                  raise SystemExit('release archive contract mismatch')

              for member in members:
                  record = expected[member.name]
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable release archive member: {member.name}')
                  data = source.read(int(record['bytes']) + 1)
                  if len(data) != record['bytes']:
                      raise SystemExit(f'release member read-size mismatch: {member.name}')
                  if hashlib.sha256(data).hexdigest() != record['sha256']:
                      raise SystemExit(f'release member checksum mismatch: {member.name}')
                  destination = overlay.joinpath(*PurePosixPath(member.name).parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.parent.resolve(strict=True).relative_to(overlay.resolve(strict=True))
                  destination.write_bytes(data)
                  mode = int(str(record['mode']), 8)
                  destination.chmod(mode)
                  if stat.S_IMODE(destination.stat().st_mode) != mode:
                      raise SystemExit(f'release member mode mismatch: {member.name}')

          receipt = {
              'schemaVersion': '1.0',
              'releaseVersion': '0.7.0',
              'archiveBytes': len(archive_bytes),
              'archiveSha256': actual_sha,
              'fileCount': len(expected),
          }
          (root / 'overlay-receipt.json').write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(f"verified {len(expected)} release files from {len(archive_bytes)} archive bytes")
          PY

          cp -a recovered-overlay/. .
          rm -rf recovered-overlay
          rm -rf .evavo/bootstrap
          rm -f .evavo/agent-audio-upgrade-diagnostic.txt
          rm -f .evavo/managed-sandbox-0.7-diagnostic.txt
          rm -f .evavo/managed-sandbox-release-pr.txt
          rm -f .github/workflows/apply-agent-audio-upgrade.yml
          rm -f .github/workflows/apply-managed-sandbox-0.7.yml
          rm -f .github/workflows/dispatch-agent-audio-upgrade.yml
          test ! -d .evavo/bootstrap
          test ! -e .github/workflows/apply-managed-sandbox-0.7.yml
          test ! -e .github/workflows/dispatch-agent-audio-upgrade.yml
          git diff --check

      - name: Build a complete deterministic source artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          root = Path.cwd().resolve(strict=True)
          excluded_names = {
              '.git',
              'final-source.tar.gz',
              'final-tree-receipt.json',
              'overlay-receipt.json',
          }
          files: list[dict[str, object]] = []
          for directory, names, filenames in os.walk(root, topdown=True, followlinks=False):
              current = Path(directory)
              names[:] = sorted(name for name in names if name not in excluded_names)
              for name in sorted(filenames):
                  path = current / name
                  relative = path.relative_to(root).as_posix()
                  if relative in excluded_names:
                      continue
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit(f'unsafe final source entry: {relative}')
                  data = path.read_bytes()
                  files.append(
                      {
                          'path': relative,
                          'bytes': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                          'mode': oct(stat.S_IMODE(path.stat().st_mode)),
                      }
                  )
          receipt = {
              'schemaVersion': '1.0',
              'releaseVersion': '0.7.0',
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'fileCount': len(files),
              'files': files,
          }
          Path('final-tree-receipt.json').write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(f"recorded {len(files)} final source files")
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude=.git \
            --exclude=final-source.tar.gz \
            --exclude=final-tree-receipt.json \
            --exclude=overlay-receipt.json \
            -czf final-source.tar.gz .
          sha256sum final-source.tar.gz final-tree-receipt.json overlay-receipt.json

      - name: Upload the complete verified source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-sandbox-0.7-complete-source
          path: |
            final-source.tar.gz
            final-tree-receipt.json
            overlay-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
