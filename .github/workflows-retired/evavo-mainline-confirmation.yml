name: EVAVO mainline confirmation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to validate
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Confirm Godot lab source and policy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: evavo-mainline-${{ inputs.expected_sha }}-godot-lab-source
      cancel-in-progress: false

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_sha" >&2
            exit 1
          fi
          if [[ "$REQUEST_SOURCE" != "evavo-development-studio" ]]; then
            echo "Unsupported request_source" >&2
            exit 1
          fi

      - name: Check out exact mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but checked out $ACTUAL_SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Verify source toolchain authority
        run: python scripts/check_repository_toolchain.py

      - name: Run adversarial toolchain fixtures
        run: python scripts/test_repository_toolchain.py

      - name: Install bounded review-first dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Install the pinned MCP agent bridge
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[agent]"

      - name: Verify the installed MCP SDK identity
        run: python scripts/check_repository_toolchain.py --agent-installed

      - name: Build the root-restricted MCP server
        run: >-
          python -m godot_game_test_lab.mcp_server
          --lab-root .
          --allowed-root .
          --evidence-root "${RUNNER_TEMP}/godot-lab-mcp-evidence"
          --engine-root "${RUNNER_TEMP}/godot-lab-engines"
          --allow-noninteractive
          --self-test

      - name: Compile source, scripts and tests
        run: python -m compileall -q src scripts tests

      - name: Verify managed-engine lock and empty-cache commands
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m godot_game_test_lab.cli engine status \
            --root "${RUNNER_TEMP}/godot-lab-engines"
          status_code=$?
          set -e
          test "${status_code}" -eq 2
          python - <<'PY'
          from godot_game_test_lab.engine_manager import load_engine_lock
          lock = load_engine_lock()
          assert lock.minimum_version == "4.6.2"
          assert lock.default_version == "4.6.3"
          assert lock.channels == {"4.6": "4.6.3", "4.7": "4.7.1"}
          PY

      - name: Run Ruff
        run: python -m ruff check src scripts tests

      - name: Parse shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts containers -type f -name '*.sh' -print0)

      - name: Parse PowerShell entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName))
          }

      - name: Run tests
        run: python -m pytest

      - name: Build wheel without dependency resolution
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Remove generated outputs and verify clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record source-only truth boundary
        shell: bash
        run: |
          printf '%s\n' \
            '### Godot Game Test Lab source confirmation' \
            '' \
            '- Exact Python, workflow and repository toolchain contract: passed' \
            '- Python compile, lint, shell parsing, tests and wheel build: passed' \
            '- Reusable caller-context workflow contract: source-tested only' \
            '- Profile schema 2.0 and journey mutation contract: source-tested only' \
            '- Windows runner probe: not performed' \
            '- Linux Docker image and rendered fixture: not performed' \
            '- Godot executable identity: not performed' \
            '- Godot .NET editor and SDK identity: not performed' \
            '- Target project import, boot, export or movie: not performed' \
            '- Keyboard, mouse or synthetic joypad journey: not performed' \
            '- Physical controller or human UX review: not performed' \
            >> "$GITHUB_STEP_SUMMARY"
