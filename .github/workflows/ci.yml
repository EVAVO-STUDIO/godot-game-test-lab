name: Recover complete managed sandbox release tree

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-managed-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover-source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/managed-sandbox-release-0.7')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the trusted same-repository branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare the complete verified source tree outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python .evavo/recover_complete_release.py
          test -d "${RUNNER_TEMP}/final-source-tree"
          test ! -e "${RUNNER_TEMP}/final-source-tree/.evavo/bootstrap"
          test ! -e "${RUNNER_TEMP}/final-source-tree/.github/workflows/apply-managed-sandbox-0.7.yml"
          test ! -e "${RUNNER_TEMP}/final-source-tree/.github/workflows/dispatch-agent-audio-upgrade.yml"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf final-source.tar.gz -C "${RUNNER_TEMP}/final-source-tree" .
          sha256sum final-source.tar.gz final-tree-receipt.json overlay-receipt.json

      - name: Upload the complete verified source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-sandbox-0.7-complete-source
          path: |
            final-source.tar.gz
            final-tree-receipt.json
            overlay-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
