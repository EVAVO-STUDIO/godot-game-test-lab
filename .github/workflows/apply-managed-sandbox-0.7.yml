name: Apply corrected managed Godot sandbox 0.7 release

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-managed-godot-sandbox-0-7-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'EVAVO-STUDIO' &&
       github.repository_owner == 'EVAVO-STUDIO' &&
       github.event.issue.title == 'EVAVO internal managed Godot sandbox release 0.7.0 corrected transport')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Reconstruct and verify the exact bounded release archive
        shell: bash
        env:
          EXPECTED_ARCHIVE_BYTES: "114059"
          EXPECTED_ARCHIVE_SHA256: c6a6ed63d7fe8078591430c2a0fb93c066bf37b3e5347f8c5744cd2d2891ce51
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          import re
          from pathlib import Path

          root = Path.cwd().resolve(strict=True)
          encoded_parts: list[str] = []
          for number in range(22):
              relative = Path(
                  f".evavo/bootstrap/managed-sandbox-0.7-small-{number:03d}.b64"
              )
              path = root / relative
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"missing or unsafe release segment: {relative}")
              if path.resolve(strict=True) != path.absolute():
                  raise SystemExit(f"non-canonical release segment: {relative}")
              source = path.read_text(encoding="ascii")
              compact = "".join(source.split())
              if not compact or re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", compact) is None:
                  raise SystemExit(f"invalid Base64 release segment: {relative}")
              if number < 21 and "=" in compact:
                  raise SystemExit(f"non-final release segment contains padding: {relative}")
              encoded_parts.append(compact)

          encoded = "".join(encoded_parts)
          try:
              archive = base64.b64decode(encoded, validate=True)
          except ValueError as error:
              raise SystemExit(f"release Base64 could not be decoded: {error}") from error
          expected_bytes = int(os.environ["EXPECTED_ARCHIVE_BYTES"])
          expected_sha = os.environ["EXPECTED_ARCHIVE_SHA256"]
          actual_sha = hashlib.sha256(archive).hexdigest()
          if len(archive) != expected_bytes or actual_sha != expected_sha:
              raise SystemExit(
                  "release archive identity mismatch: "
                  f"bytes={len(archive)} sha256={actual_sha}"
              )
          destination = Path(os.environ["RUNNER_TEMP"]) / "managed-sandbox-0.7.tar.gz"
          destination.write_bytes(archive)
          print(f"verified release archive: {len(archive)} bytes, {actual_sha}")
          PY

      - name: Safely apply the manifest-bound source overlay
        shell: bash
        env:
          PAYLOAD: ${{ runner.temp }}/managed-sandbox-0.7.tar.gz
          MANIFEST: .evavo/bootstrap/managed-sandbox-0.7.manifest.json
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import stat
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve(strict=True)
          payload = Path(os.environ["PAYLOAD"]).resolve(strict=True)
          manifest_path = Path(os.environ["MANIFEST"])
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit("release manifest is missing or unsafe")
          if manifest_path.resolve(strict=True) != manifest_path.absolute():
              raise SystemExit("release manifest is non-canonical")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schemaVersion") != "1.0":
              raise SystemExit("unsupported managed-sandbox manifest schema")
          if manifest.get("releaseVersion") != "0.7.0":
              raise SystemExit("unexpected managed-sandbox release version")
          if manifest.get("archiveBytes") != payload.stat().st_size:
              raise SystemExit("release manifest archive byte count mismatch")
          actual_archive_sha = hashlib.sha256(payload.read_bytes()).hexdigest()
          if manifest.get("archiveSha256") != actual_archive_sha:
              raise SystemExit("release manifest archive checksum mismatch")

          records = manifest.get("files")
          if not isinstance(records, list) or not records or len(records) > 256:
              raise SystemExit("release manifest file inventory is invalid")
          expected: dict[str, dict[str, object]] = {}
          for item in records:
              if not isinstance(item, dict) or not isinstance(item.get("path"), str):
                  raise SystemExit("release manifest contains an invalid file record")
              name = item["path"]
              if name in expected:
                  raise SystemExit(f"duplicate release manifest path: {name}")
              pure = PurePosixPath(name)
              if pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                  raise SystemExit(f"unsafe release manifest path: {name}")
              expected[name] = item

          observed: set[str] = set()
          expanded_bytes = 0
          with tarfile.open(payload, mode="r:gz") as archive:
              members = archive.getmembers()
              if len(members) != len(expected):
                  raise SystemExit("release payload member count mismatch")
              for member in members:
                  pure = PurePosixPath(member.name)
                  if (
                      pure.is_absolute()
                      or any(part in {"", ".", ".."} for part in pure.parts)
                      or not member.isfile()
                      or member.name in observed
                      or member.name not in expected
                      or member.size < 0
                      or member.size > 4 * 1024 * 1024
                  ):
                      raise SystemExit(f"unsafe release member: {member.name}")
                  record = expected[member.name]
                  if member.size != record.get("bytes"):
                      raise SystemExit(f"release member size mismatch: {member.name}")
                  observed.add(member.name)
                  expanded_bytes += member.size
              if observed != set(expected) or expanded_bytes > 8 * 1024 * 1024:
                  raise SystemExit("release payload contract mismatch")

              for member in members:
                  record = expected[member.name]
                  destination = root.joinpath(*PurePosixPath(member.name).parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.parent.resolve(strict=True).relative_to(root)
                  if destination.is_symlink():
                      raise SystemExit(f"release destination may not be a link: {member.name}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"release member is unreadable: {member.name}")
                  data = source.read(int(record["bytes"]) + 1)
                  if len(data) != record["bytes"]:
                      raise SystemExit(f"release member read size mismatch: {member.name}")
                  if hashlib.sha256(data).hexdigest() != record["sha256"]:
                      raise SystemExit(f"release member hash mismatch: {member.name}")
                  temporary = destination.with_name(destination.name + ".evavo-release-tmp")
                  if temporary.exists() or temporary.is_symlink():
                      raise SystemExit(f"temporary release path exists: {temporary}")
                  with temporary.open("xb") as output:
                      output.write(data)
                  mode = int(str(record["mode"]), 8)
                  temporary.chmod(mode)
                  temporary.replace(destination)
                  if stat.S_IMODE(destination.stat().st_mode) != mode:
                      raise SystemExit(f"release mode mismatch: {member.name}")
          PY

      - name: Remove all one-time publication infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-agent-audio-upgrade.yml
          rm -f .github/workflows/dispatch-agent-audio-upgrade.yml
          rm -f .github/workflows/apply-managed-sandbox-0.7.yml
          rm -f .evavo/agent-audio-upgrade-diagnostic.txt
          rm -f .evavo/managed-sandbox-0.7-diagnostic.txt
          rm -rf .evavo/bootstrap

      - name: Verify the repository-owned source contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Install pinned validation and MCP dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --disable-pip-version-check ".[dev]"
          python scripts/check_repository_toolchain.py --installed
          python -m pip install --disable-pip-version-check ".[agent]"
          python scripts/check_repository_toolchain.py --agent-installed

      - name: Compile, lint, parse, test and build
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts containers -type f -name '*.sh' -print0)
          pwsh -NoLogo -NoProfile -NonInteractive -Command \
            '$ErrorActionPreference="Stop"; Get-ChildItem scripts -Filter *.ps1 | ForEach-Object { $null=[scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) }'
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify MCP and managed-engine surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mcp-evidence" "${RUNNER_TEMP}/managed-engines"
          python -m godot_game_test_lab.mcp_server \
            --lab-root . \
            --allowed-root . \
            --evidence-root "${RUNNER_TEMP}/mcp-evidence" \
            --engine-root "${RUNNER_TEMP}/managed-engines" \
            --allow-noninteractive \
            --self-test
          python -m godot_game_test_lab.cli capabilities > "${RUNNER_TEMP}/capabilities.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              Path(os.environ["RUNNER_TEMP"]).joinpath("capabilities.json").read_text()
          )
          assert value["toolVersion"] == "0.7.0"
          assert value["automationEntrypoints"]["managedEngine"] == "godot-lab-engine"
          assert value["automationEntrypoints"]["localSandbox"] == "godot-lab-sandbox"
          assert value["automationEntrypoints"]["mcpAgentBridge"] == "godot-lab-mcp"
          PY

      - name: Clean generated outputs and verify the final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name '*.pyc' -delete
          test ! -d .evavo/bootstrap
          test ! -e .github/workflows/apply-managed-sandbox-0.7.yml
          test ! -e .github/workflows/apply-agent-audio-upgrade.yml
          test ! -e .github/workflows/dispatch-agent-audio-upgrade.yml
          git diff --check

      - name: Commit the validated release directly to main
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Remote main drifted from ${EXPECTED_HEAD} to ${remote_head}." >&2
            exit 1
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "feat(sandbox): add managed Godot toolchains and agent QA"
          git push origin HEAD:main
