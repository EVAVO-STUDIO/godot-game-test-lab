[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "godot-game-test-lab"
version = "0.9.0"
description = "Automated Godot build, interaction, visual evidence and QA orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EVAVO Studio" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.3.0",
  "ruff==0.9.0",
]
agent = [
  "mcp==1.28.1",
]

[project.scripts]
godot-lab = "godot_game_test_lab.cli:main"
godot-lab-native-qa = "godot_game_test_lab.native_qa:main"
godot-lab-multiplayer-qa = "godot_game_test_lab.multiplayer_qa:main"
godot-lab-bot-qa = "godot_game_test_lab.bot_qa:main"
godot-lab-init-qa = "godot_game_test_lab.profile_bootstrap:main"
godot-lab-media-qa = "godot_game_test_lab.media_cli:main"
godot-lab-mcp = "godot_game_test_lab.mcp_server:main"
godot-lab-engine = "godot_game_test_lab.engine_cli:main"
godot-lab-sandbox = "godot_game_test_lab.local_sandbox:main"
godot-lab-web-export-audit = "godot_game_test_lab.web_export_audit:main"
godot-lab-android-journey = "godot_game_test_lab.android_semantic_driver_cli:main"
godot-lab-rally-falcon-preview = "godot_game_test_lab.rally_falcon_preview:main"
godot-lab-localization-plural = "godot_game_test_lab.localization_plural_runtime_cli:main"
godot-lab-localization-stable-id-bundle = "godot_game_test_lab.localization_stable_id_bundle_cli:main"
godot-lab-sprite-animation = "godot_game_test_lab.sprite_animation_runtime_cli:main"
godot-lab-sprite-animation-probe = "godot_game_test_lab.sprite_animation_probe_runner:main"
godot-lab-movie-evidence = "godot_game_test_lab.movie_evidence_cli:main"
godot-lab-movie-temporal = "godot_game_test_lab.movie_temporal_cli:main"
godot-lab-movie-source-identities = "godot_game_test_lab.movie_source_identity_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_game_test_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/godot_game_test_lab/godot-engine-lock.json" = "godot_game_test_lab/godot-engine-lock.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-safe-fixes = ["UP038"]

[tool.ruff.lint.per-file-ignores]
"src/godot_game_test_lab/visual_animation_admission.py" = ["E501"]
"tests/test_visual_animation_admission.py" = ["E501"]
"src/godot_game_test_lab/pixel_font_admission.py" = ["E501"]
"tests/test_pixel_font_admission.py" = ["E501"]
"scripts/check_game_asset_delivery_admission.py" = ["E501"]
"scripts/check_repository_toolchain.py" = ["E501"]
"src/godot_game_test_lab/game_asset_delivery_admission.py" = ["E501"]
"src/godot_game_test_lab/game_asset_delivery_common.py" = ["E501", "F401"]
"src/godot_game_test_lab/game_asset_delivery_native.py" = ["E501"]
"tests/test_game_asset_delivery_admission.py" = ["E501", "F401", "UP012"]
"tests/test_workflow_inventory.py" = ["E501"]
"src/godot_game_test_lab/rally_falcon_preview.py" = ["E501"]
"tests/test_rally_falcon_preview.py" = ["E501"]
"src/godot_game_test_lab/multiplayer_profile.py" = ["E501"]
"src/godot_game_test_lab/multiplayer_qa.py" = ["E501"]
"tests/test_multiplayer_profile.py" = ["E501"]
"src/godot_game_test_lab/localization_plural.py" = ["E501"]
"src/godot_game_test_lab/localization_plural_cli.py" = ["E501"]
"src/godot_game_test_lab/localization_plural_cli_safe.py" = ["E501"]
"src/godot_game_test_lab/localization_plural_runtime.py" = ["E501"]
"src/godot_game_test_lab/localization_plural_runtime_cli.py" = ["E501"]
"src/godot_game_test_lab/localization_plural_safe.py" = ["E501"]
"tests/test_localization_plural.py" = ["E501"]
"tests/test_localization_plural_guarded.py" = ["E501"]
"src/godot_game_test_lab/localization_stable_id_bundle.py" = ["E501"]
"src/godot_game_test_lab/localization_stable_id_bundle_cli.py" = ["E501"]
"tests/test_localization_stable_id_bundle.py" = ["E501"]
"tests/test_localization_stable_id_bundle_contract_surface.py" = ["E501"]
