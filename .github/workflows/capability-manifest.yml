name: Capability manifest

on:
  push:
    branches:
      - main
    paths:
      - "evavo.capabilities.json"
      - "schemas/evavo.repository-capabilities.schema.json"
      - "scripts/check_evavo_capability_manifest.py"
      - "docs/CAPABILITY_MANIFEST.md"
      - "pyproject.toml"
      - "src/godot_game_test_lab/engine_manager.py"
      - "src/godot_game_test_lab/mcp_server.py"
      - "src/godot_game_test_lab/native_qa.py"
      - "src/godot_game_test_lab/native_qa_runner.py"
      - "src/godot_game_test_lab/bot_qa.py"
      - "src/godot_game_test_lab/bot_runner.py"
      - "src/godot_game_test_lab/local_sandbox.py"
      - "src/godot_game_test_lab/media_cli.py"
      - "src/godot_game_test_lab/media_evidence.py"
      - "src/godot_game_test_lab/game_asset_delivery_admission.py"
      - "src/godot_game_test_lab/visual_animation_admission.py"
      - "src/godot_game_test_lab/pipeline.py"
      - "tools/rig_motion_acceptance_v4_1.py"
      - "tools/rig_motion_probe_v4_1.gd"
  pull_request:
    paths:
      - "evavo.capabilities.json"
      - "schemas/evavo.repository-capabilities.schema.json"
      - "scripts/check_evavo_capability_manifest.py"
      - "docs/CAPABILITY_MANIFEST.md"
      - "pyproject.toml"
      - "src/godot_game_test_lab/engine_manager.py"
      - "src/godot_game_test_lab/mcp_server.py"
      - "src/godot_game_test_lab/native_qa.py"
      - "src/godot_game_test_lab/native_qa_runner.py"
      - "src/godot_game_test_lab/bot_qa.py"
      - "src/godot_game_test_lab/bot_runner.py"
      - "src/godot_game_test_lab/local_sandbox.py"
      - "src/godot_game_test_lab/media_cli.py"
      - "src/godot_game_test_lab/media_evidence.py"
      - "src/godot_game_test_lab/game_asset_delivery_admission.py"
      - "src/godot_game_test_lab/visual_animation_admission.py"
      - "src/godot_game_test_lab/pipeline.py"
      - "tools/rig_motion_acceptance_v4_1.py"
      - "tools/rig_motion_probe_v4_1.gd"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-lab-capability-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate discovery and authority contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate manifest against live source
        run: python scripts/check_evavo_capability_manifest.py

      - name: Compile capability-bound Python entrypoints
        run: |
          python -m py_compile \
            scripts/check_evavo_capability_manifest.py \
            src/godot_game_test_lab/engine_manager.py \
            src/godot_game_test_lab/mcp_server.py \
            src/godot_game_test_lab/native_qa.py \
            src/godot_game_test_lab/native_qa_runner.py \
            src/godot_game_test_lab/bot_qa.py \
            src/godot_game_test_lab/bot_runner.py \
            src/godot_game_test_lab/local_sandbox.py \
            src/godot_game_test_lab/media_cli.py \
            src/godot_game_test_lab/media_evidence.py \
            src/godot_game_test_lab/game_asset_delivery_admission.py \
            src/godot_game_test_lab/visual_animation_admission.py \
            src/godot_game_test_lab/pipeline.py \
            tools/rig_motion_acceptance_v4_1.py

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[dev]"

      - name: Run capability-bound regressions
        run: |
          python -m pytest -q \
            tests/test_engine_manager.py \
            tests/test_native_qa_hardening.py \
            tests/test_bot_summary_gate.py \
            tests/test_local_sandbox.py \
            tests/test_media_evidence.py \
            tests/test_game_asset_delivery_admission.py \
            tests/test_visual_animation_admission.py \
            tests/test_rig_motion_acceptance_v4_1.py

      - name: Verify tracked tree remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
