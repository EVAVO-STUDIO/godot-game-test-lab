name: Dispatch MCP and synchronized audio upgrade

on:
  issues:
    types: [edited]

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-godot-agent-audio-upgrade
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event.issue.number == 3 && github.repository_owner == 'EVAVO-STUDIO'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch guarded publisher on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-agent-audio-upgrade.yml --ref main
