name: Dispatch corrected managed Godot sandbox release

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-managed-godot-sandbox-0-7
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'EVAVO-STUDIO' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/managed-sandbox-release-0.7' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the manifest-bound publisher from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-managed-sandbox-0.7.yml --ref main
