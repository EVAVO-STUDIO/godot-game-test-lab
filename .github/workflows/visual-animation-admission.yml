name: Visual animation admission

on:
  pull_request:
    paths:
      - "config/visual-animation-admission.v1.json"
      - "src/godot_game_test_lab/visual_animation_admission.py"
      - "tests/test_visual_animation_admission.py"
      - "docs/VISUAL_ANIMATION_ADMISSION.md"
      - ".github/workflows/visual-animation-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m py_compile src/godot_game_test_lab/visual_animation_admission.py tests/test_visual_animation_admission.py
      - run: pytest -q tests/test_visual_animation_admission.py
