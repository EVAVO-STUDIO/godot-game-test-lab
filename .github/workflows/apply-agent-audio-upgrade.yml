name: Apply MCP and synchronized audio agent upgrade

on:
  push:
    branches: [main]
    paths: [".evavo/bootstrap/agent-audio-upgrade.ready"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-godot-agent-audio-upgrade-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"
      - name: Reconstruct and apply exact bounded payload
        shell: bash
        run: |
          set -euo pipefail
          cat .evavo/bootstrap/agent-audio-upgrade-{00..11}.b64 \
            | base64 --decode > "${RUNNER_TEMP}/agent-audio-upgrade.tar.gz"
          printf '%s  %s\n' \
            '054caa759241ed1f708b4cb9ac0099831406f5d053975f9aa139ded54989f5de' \
            "${RUNNER_TEMP}/agent-audio-upgrade.tar.gz" | sha256sum --check --strict
          PAYLOAD="${RUNNER_TEMP}/agent-audio-upgrade.tar.gz" python - <<'PY'
          from __future__ import annotations
          import os, tarfile
          from pathlib import Path, PurePosixPath
          expected = {
              "docs/MCP_AGENT_BRIDGE.md", "examples/media-policy.json",
              "schemas/media-policy.schema.json", "scripts/Write-GodotLabMcpConfig.ps1",
              "scripts/apply_agent_audio_upgrade.py",
              "src/godot_game_test_lab/agent_bridge.py",
              "src/godot_game_test_lab/mcp_server.py",
              "src/godot_game_test_lab/media_cli.py",
              "src/godot_game_test_lab/media_evidence.py",
              "tests/test_agent_bridge.py", "tests/test_mcp_bridge_contract.py",
              "tests/test_media_evidence.py",
          }
          root = Path.cwd().resolve(strict=True)
          with tarfile.open(os.environ["PAYLOAD"], "r:gz") as archive:
              members = archive.getmembers()
              observed = set()
              total = 0
              for member in members:
                  pure = PurePosixPath(member.name)
                  if (pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts)
                      or not member.isfile() or member.size < 0 or member.size > 4 * 1024 * 1024
                      or member.name in observed):
                      raise SystemExit(f"unsafe payload member: {member.name}")
                  observed.add(member.name)
                  total += member.size
              if observed != expected or total > 8 * 1024 * 1024:
                  raise SystemExit(f"payload contract mismatch: {sorted(observed)}")
              for member in members:
                  destination = root.joinpath(*PurePosixPath(member.name).parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"unreadable payload member: {member.name}")
                  temporary = destination.with_name(destination.name + ".evavo-tmp")
                  with source, temporary.open("xb") as output:
                      output.write(source.read())
                  temporary.replace(destination)
          PY
          python scripts/apply_agent_audio_upgrade.py
          python - <<'PY'
          from pathlib import Path
          replacements = (
              ("tests/test_cli.py", 'assert payload["schemaVersion"] == "1.1"',
               'assert payload["schemaVersion"] == "1.2"'),
              ("tests/test_release_contract.py", 'expected = "0.5.0"',
               'expected = "0.6.0"'),
          )
          for relative, old, new in replacements:
              path = Path(relative)
              source = path.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"stale-contract anchor changed: {relative}")
              path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          path = Path("tests/test_cli.py")
          source = path.read_text(encoding="utf-8")
          old = '        "nativeBotQa": "godot-lab-bot-qa",\n'
          new = (
              old
              + '        "mediaQa": "godot-lab-media-qa",\n'
              + '        "mcpAgentBridge": "godot-lab-mcp",\n'
          )
          if source.count(old) != 1:
              raise SystemExit("CLI automation-entrypoint test anchor changed")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          path = Path("tests/test_mcp_bridge_contract.py")
          source = path.read_text(encoding="utf-8")
          old = "import pytest\n\n\n\n"
          if source.count(old) != 1:
              raise SystemExit("MCP test import anchor changed")
          path.write_text(source.replace(old, "import pytest\n\n\n"), encoding="utf-8", newline="\n")
          PY
          rm -f scripts/apply_agent_audio_upgrade.py
          rm -f .evavo/bootstrap/agent-audio-upgrade-*.b64
          rm -f .evavo/bootstrap/agent-audio-upgrade.ready
          rm -f .github/workflows/apply-agent-audio-upgrade.yml
          rm -f .evavo/agent-audio-upgrade-diagnostic.txt
          rmdir .evavo/bootstrap 2>/dev/null || true
      - name: Validate complete source and optional MCP bridge
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py
          python -m pip install --disable-pip-version-check ".[dev]"
          python scripts/check_repository_toolchain.py --installed
          python -m pip install --disable-pip-version-check ".[agent]"
          python scripts/check_repository_toolchain.py --agent-installed
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do bash -n "$script"; done \
            < <(find scripts containers -type f -name '*.sh' -print0)
          pwsh -NoLogo -NoProfile -NonInteractive -Command \
            '$files=@("scripts/Write-GodotLabMcpConfig.ps1","scripts/Invoke-GodotLabBotQA.ps1","scripts/Invoke-GodotLabNativeAgentQA.ps1"); foreach($file in $files){$source=Get-Content -Raw -LiteralPath $file;$null=[scriptblock]::Create($source)}'
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .
          mkdir -p "${RUNNER_TEMP}/mcp-evidence"
          python -m godot_game_test_lab.mcp_server --lab-root . --allowed-root . \
            --evidence-root "${RUNNER_TEMP}/mcp-evidence" --allow-noninteractive --self-test
      - name: Clean and publish exact validated source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name '*.pyc' -delete
          test ! -e .github/workflows/apply-agent-audio-upgrade.yml
          test ! -e scripts/apply_agent_audio_upgrade.py
          test ! -d .evavo/bootstrap
          git diff --check
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_HEAD}"
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "feat(agent): add MCP visual and synchronized audio QA"
          git push origin HEAD:main
      - name: Retain bounded failure diagnostics
        if: failure()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set +e
          diagnostic=.evavo/agent-audio-upgrade-diagnostic.txt
          mkdir -p .evavo
          {
            printf 'trigger_sha=%s\nutc=%s\n' "$EXPECTED_HEAD" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n== status ==\n'; git status --short --untracked-files=all
            printf '\n== diff ==\n'; git diff --check
            printf '\n== toolchain ==\n'; python scripts/check_repository_toolchain.py --skip-runtime
            printf '\n== ruff ==\n'; python -m ruff check src scripts tests
            printf '\n== tests ==\n'; python -m pytest -q
          } > "$diagnostic" 2>&1
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" = "$EXPECTED_HEAD" ]]; then
            git config user.name "EVAVO Studio Automation"
            git config user.email "automation@evavo.com.au"
            git add "$diagnostic"
            git commit -m "diagnose(agent): retain MCP and audio upgrade failure"
            git push origin HEAD:main
          fi
