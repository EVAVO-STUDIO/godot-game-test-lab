name: Apply deterministic Godot bot QA upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".evavo/bootstrap/bot-qa-upgrade.ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-deterministic-godot-bot-qa-main
  cancel-in-progress: true

jobs:
  apply:
    name: Validate and publish deterministic bot QA
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out exact triggering main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Reconstruct, verify and apply exact bot QA patch
        run: |
          set -euo pipefail
          cat .evavo/bootstrap/bot-qa-upgrade-{00..04}.b64 \
            | base64 --decode > "${RUNNER_TEMP}/bot-qa-upgrade.py.gz"
          printf '%s  %s\n' \
            'b6491be1712706c4bd3d48b71b3c34a3b851eede204ccdc4abf55b1b544ed86d' \
            "${RUNNER_TEMP}/bot-qa-upgrade.py.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout "${RUNNER_TEMP}/bot-qa-upgrade.py.gz" \
            > scripts/apply_bot_qa_upgrade.py
          printf '%s  %s\n' \
            '23d4bdc72d79b87a55155ed9d687b4adf9d44ff34b282b3225a2e61e553b8987' \
            'scripts/apply_bot_qa_upgrade.py' \
            | sha256sum --check --strict
          python scripts/apply_bot_qa_upgrade.py
          rm -f scripts/apply_bot_qa_upgrade.py
          rm -f .evavo/bootstrap/bot-qa-upgrade-*.b64
          rm -f .evavo/bootstrap/bot-qa-upgrade.ready
          rmdir .evavo/bootstrap 2>/dev/null || true
          rm -f .github/workflows/apply-bot-qa-upgrade.yml

      - name: Verify repository-owned toolchain authority
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Install pinned development dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Compile, lint, parse and test complete source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts containers -type f -name '*.sh' -print0)
          pwsh -NoLogo -NoProfile -NonInteractive -Command \
            '$paths = @("scripts/Invoke-GodotLabNativeAgentQA.ps1", "scripts/Invoke-GodotLabBotQA.ps1"); foreach ($path in $paths) { $source = Get-Content -Raw -LiteralPath $path; $null = [scriptblock]::Create($source) }'
          python - <<'PY'
          import json
          from pathlib import Path

          for relative in (
              "schemas/native-agent-qa-profile.schema.json",
              "schemas/bot-qa-profile.schema.json",
              "examples/native-agent-qa.profile.json",
              "examples/bot-qa.profile.json",
              "evavo.reliability.json",
          ):
              json.loads(Path(relative).read_text(encoding="utf-8"))
          PY
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Clean generated files and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name '*.pyc' -delete
          test ! -e scripts/apply_bot_qa_upgrade.py
          test ! -e .github/workflows/apply-bot-qa-upgrade.yml
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -E '^(\?\?| M|M |A | D|D ) (dist|\.pytest_cache|\.ruff_cache|src/.*\.egg-info|.*__pycache__|.*\.pyc)' || true)"

      - name: Commit validated bot QA directly to main
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Remote main drifted from ${EXPECTED_HEAD} to ${remote_head}." >&2
            exit 1
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "feat(qa): add deterministic Godot bot exploration"
          git push origin HEAD:main

      - name: Retain bounded failure diagnostic
        if: failure()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set +e
          diagnostic='.evavo/bot-qa-upgrade-diagnostic.txt'
          mkdir -p .evavo
          {
            printf 'trigger_sha=%s\n' "${EXPECTED_HEAD}"
            printf 'utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n== status ==\n'
            git status --short --untracked-files=all
            printf '\n== diff check ==\n'
            git diff --check
            printf '\n== compile ==\n'
            python -m compileall -q src scripts tests
            printf '\n== ruff ==\n'
            python -m ruff check src scripts tests
            printf '\n== bot tests ==\n'
            python -m pytest -q tests/test_bot_qa.py
            printf '\n== full tests ==\n'
            python -m pytest -q
          } > "${diagnostic}" 2>&1
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Not publishing diagnostics because main drifted to ${remote_head}."
            exit 0
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add "${diagnostic}"
          git commit -m "diagnose(qa): retain bot QA upgrade failure"
          git push origin HEAD:main