name: Apply managed Godot sandbox 0.7 release

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-managed-godot-sandbox-0-7-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'EVAVO-STUDIO' &&
       github.event.issue.title == 'EVAVO internal managed Godot sandbox release 0.7.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Reconstruct and verify bounded release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .evavo/bootstrap/managed-sandbox-0.7-*.b64 \
            | tr -d '\n\r' \
            | base64 --decode > "${RUNNER_TEMP}/managed-sandbox-0.7.tar.gz"
          printf '%s  %s\n' \
            'c6a6ed63d7fe8078591430c2a0fb93c066bf37b3e5347f8c5744cd2d2891ce51' \
            "${RUNNER_TEMP}/managed-sandbox-0.7.tar.gz" \
            | sha256sum --check --strict

      - name: Safely apply exact release overlay
        shell: bash
        env:
          PAYLOAD: ${{ runner.temp }}/managed-sandbox-0.7.tar.gz
          MANIFEST: .evavo/bootstrap/managed-sandbox-0.7.manifest.json
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import stat
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve(strict=True)
          payload = Path(os.environ["PAYLOAD"]).resolve(strict=True)
          manifest_path = Path(os.environ["MANIFEST"]).resolve(strict=True)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schemaVersion") != "1.0":
              raise SystemExit("unsupported managed-sandbox manifest schema")
          expected = {
              item["path"]: item
              for item in manifest.get("files", [])
              if isinstance(item, dict) and isinstance(item.get("path"), str)
          }
          if len(expected) != len(manifest.get("files", [])) or not expected:
              raise SystemExit("release manifest contains duplicate or invalid file entries")
          if manifest.get("archiveSha256") != hashlib.sha256(payload.read_bytes()).hexdigest():
              raise SystemExit("release manifest archive checksum mismatch")
          if payload.stat().st_size > 32 * 1024 * 1024:
              raise SystemExit("release payload exceeds bounded archive limit")

          observed: set[str] = set()
          expanded = 0
          with tarfile.open(payload, mode="r:gz") as archive:
              members = archive.getmembers()
              if len(members) != len(expected) or len(members) > 256:
                  raise SystemExit("release payload member count mismatch")
              for member in members:
                  pure = PurePosixPath(member.name)
                  if (
                      pure.is_absolute()
                      or any(part in {"", ".", ".."} for part in pure.parts)
                      or not member.isfile()
                      or member.name in observed
                      or member.name not in expected
                      or member.size < 0
                      or member.size > 4 * 1024 * 1024
                  ):
                      raise SystemExit(f"unsafe release member: {member.name}")
                  observed.add(member.name)
                  expanded += member.size
              if observed != set(expected) or expanded > 8 * 1024 * 1024:
                  raise SystemExit("release payload contract mismatch")

              for member in members:
                  record = expected[member.name]
                  destination = root.joinpath(*PurePosixPath(member.name).parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  resolved_parent = destination.parent.resolve(strict=True)
                  resolved_parent.relative_to(root)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"release member is unreadable: {member.name}")
                  data = source.read(record["bytes"] + 1)
                  if len(data) != record["bytes"]:
                      raise SystemExit(f"release member size mismatch: {member.name}")
                  if hashlib.sha256(data).hexdigest() != record["sha256"]:
                      raise SystemExit(f"release member hash mismatch: {member.name}")
                  temporary = destination.with_name(destination.name + ".evavo-release-tmp")
                  if temporary.exists() or temporary.is_symlink():
                      raise SystemExit(f"temporary release path already exists: {temporary}")
                  with temporary.open("xb") as output:
                      output.write(data)
                  mode = int(str(record["mode"]), 8)
                  temporary.chmod(mode)
                  temporary.replace(destination)
                  actual_mode = stat.S_IMODE(destination.stat().st_mode)
                  if actual_mode != mode:
                      raise SystemExit(f"release mode mismatch: {member.name}")
          PY

      - name: Remove one-time publication infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-agent-audio-upgrade.yml
          rm -f .github/workflows/dispatch-agent-audio-upgrade.yml
          rm -f .github/workflows/apply-managed-sandbox-0.7.yml
          rm -f .evavo/agent-audio-upgrade-diagnostic.txt
          rm -f .evavo/managed-sandbox-0.7-diagnostic.txt
          rm -f .evavo/bootstrap/agent-audio-upgrade-*.b64
          rm -f .evavo/bootstrap/agent-audio-upgrade.ready
          rm -f .evavo/bootstrap/managed-sandbox-0.7-*.b64
          rm -f .evavo/bootstrap/managed-sandbox-0.7.manifest.json
          rmdir .evavo/bootstrap 2>/dev/null || true

      - name: Verify repository-owned source contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Install pinned validation and MCP dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --disable-pip-version-check ".[dev]"
          python scripts/check_repository_toolchain.py --installed
          python -m pip install --disable-pip-version-check ".[agent]"
          python scripts/check_repository_toolchain.py --agent-installed

      - name: Compile, lint, parse, test and build
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts containers -type f -name '*.sh' -print0)
          pwsh -NoLogo -NoProfile -NonInteractive -Command \
            '$ErrorActionPreference="Stop"; Get-ChildItem scripts -Filter *.ps1 | ForEach-Object { $null=[scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) }'
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify MCP and managed-engine surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mcp-evidence" "${RUNNER_TEMP}/managed-engines"
          python -m godot_game_test_lab.mcp_server \
            --lab-root . \
            --allowed-root . \
            --evidence-root "${RUNNER_TEMP}/mcp-evidence" \
            --engine-root "${RUNNER_TEMP}/managed-engines" \
            --allow-noninteractive \
            --self-test
          python -m godot_game_test_lab.cli capabilities > "${RUNNER_TEMP}/capabilities.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("capabilities.json").read_text())
          assert value["toolVersion"] == "0.7.0"
          assert value["automationEntrypoints"]["managedEngine"] == "godot-lab-engine"
          assert value["automationEntrypoints"]["localSandbox"] == "godot-lab-sandbox"
          assert value["automationEntrypoints"]["mcpAgentBridge"] == "godot-lab-mcp"
          PY

      - name: Clean generated outputs and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name '*.pyc' -delete
          test ! -d .evavo/bootstrap
          test ! -e .github/workflows/apply-managed-sandbox-0.7.yml
          test ! -e .github/workflows/apply-agent-audio-upgrade.yml
          test ! -e .github/workflows/dispatch-agent-audio-upgrade.yml
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -E '^(\?\?| M|M |A | D|D ) (dist|\.pytest_cache|\.ruff_cache|src/.*\.egg-info|.*__pycache__|.*\.pyc)' || true)"

      - name: Commit validated release directly to main
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Remote main drifted from ${EXPECTED_HEAD} to ${remote_head}." >&2
            exit 1
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "feat(sandbox): add managed Godot toolchains and agent QA"
          git push origin HEAD:main

      - name: Retain bounded failure diagnostics
        if: failure()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set +e
          diagnostic=.evavo/managed-sandbox-0.7-diagnostic.txt
          mkdir -p .evavo
          {
            printf 'trigger_sha=%s\nutc=%s\n' "${EXPECTED_HEAD}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n== status ==\n'; git status --short --untracked-files=all
            printf '\n== diff check ==\n'; git diff --check
            printf '\n== toolchain ==\n'; python scripts/check_repository_toolchain.py --skip-runtime
            printf '\n== compile ==\n'; python -m compileall -q src scripts tests
            printf '\n== ruff ==\n'; python -m ruff check src scripts tests
            printf '\n== tests ==\n'; python -m pytest -q
          } > "${diagnostic}" 2>&1
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" == "${EXPECTED_HEAD}" ]]; then
            git config user.name "EVAVO Studio Automation"
            git config user.email "automation@evavo.com.au"
            git add "${diagnostic}"
            git commit -m "diagnose(sandbox): retain managed Godot release failure"
            git push origin HEAD:main
          fi
