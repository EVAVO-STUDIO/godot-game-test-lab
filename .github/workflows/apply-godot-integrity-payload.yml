name: Apply Godot integrity payload

on:
  push:
    branches:
      - main
    paths:
      - ".evavo/bootstrap/godot-integrity-payload-*.b64"
      - ".github/workflows/apply-godot-integrity-payload.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-integrity-payload-main
  cancel-in-progress: false

jobs:
  apply:
    name: Validate and publish the bounded integrity implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Reconstruct and verify bounded payload
        shell: bash
        run: |
          set -euo pipefail
          cat .evavo/bootstrap/godot-integrity-payload-{00..04}.b64 \
            | base64 --decode > "${RUNNER_TEMP}/godot-integrity-payload.tar.gz"
          printf '%s  %s\n' \
            '4aad14ebddd954c02e81495d3f545c68a3f6ffa3bd27df6631b69cdc983d4c54' \
            "${RUNNER_TEMP}/godot-integrity-payload.tar.gz" \
            | sha256sum --check --strict
          tar --extract \
            --gzip \
            --file "${RUNNER_TEMP}/godot-integrity-payload.tar.gz" \
            --directory . \
            --no-same-owner \
            --no-same-permissions
          chmod 0755 \
            scripts/linux-sandbox-entrypoint.sh \
            scripts/run_agent_godot_qa_with_integrity.py

      - name: Verify repository toolchain authority
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Install pinned development dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Compile, lint and test the full implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts containers -type f -name '*.sh' -print0)
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Remove generated and bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          rm -f .evavo/bootstrap/godot-integrity-payload-*.b64
          rmdir .evavo/bootstrap 2>/dev/null || true
          rm -f .github/workflows/apply-godot-integrity-payload.yml
          git diff --check

      - name: Commit exact implementation directly to main
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Remote main drifted from ${EXPECTED_HEAD} to ${remote_head}." >&2
            exit 1
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "feat(qa): add bounded Godot integrity and recovery diagnostics"
          git push origin HEAD:main
