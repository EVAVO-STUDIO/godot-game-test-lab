name: EVAVO native Godot validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character test-lab main commit SHA
        required: true
        type: string
      target_repository_path:
        description: Absolute target Git repository path beneath C:\GitRepos
        required: true
        type: string
      project_subpath:
        description: Relative path from the target Git root to project.godot
        required: true
        default: .
        type: string
      profile_path:
        description: Optional tracked native QA profile relative to the target Git root
        required: false
        default: ""
        type: string
      expected_target_sha:
        description: Exact 40-character target game commit SHA
        required: true
        type: string
      minimum_godot_version:
        description: Minimum compatible Godot version
        required: true
        default: 4.6.2
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

concurrency:
  group: native-godot-${{ inputs.expected_sha }}-${{ inputs.expected_target_sha }}
  cancel-in-progress: false

jobs:
  validate-native-project:
    name: Validate native Godot project
    runs-on: [self-hosted, Windows, X64, evavo-godot-lab]
    timeout-minutes: 75

    steps:
      - name: Validate dispatch inputs
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_REPOSITORY_PATH: ${{ inputs.target_repository_path }}
          PROJECT_SUBPATH: ${{ inputs.project_subpath }}
          PROFILE_PATH: ${{ inputs.profile_path }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          MINIMUM_GODOT_VERSION: ${{ inputs.minimum_godot_version }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid expected_sha.'
          }
          if ($env:EXPECTED_TARGET_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid expected_target_sha.'
          }
          if ($env:TARGET_REPOSITORY_PATH -notmatch '^[A-Za-z]:\\GitRepos\\[^\r\n]+$') {
            throw 'target_repository_path must be beneath C:\GitRepos.'
          }
          $relativePattern = '^(?:\.|[A-Za-z0-9._-]+(?:[\\/][A-Za-z0-9._-]+)*)$'
          if ($env:PROJECT_SUBPATH -notmatch $relativePattern -or
              $env:PROJECT_SUBPATH -match '(^|[\\/])\.\.([\\/]|$)') {
            throw 'project_subpath must be a traversal-free relative path.'
          }
          if ($env:PROFILE_PATH -and
              ($env:PROFILE_PATH -notmatch $relativePattern -or
               $env:PROFILE_PATH -match '(^|[\\/])\.\.([\\/]|$)')) {
            throw 'profile_path must be empty or a traversal-free relative path.'
          }
          if ($env:MINIMUM_GODOT_VERSION -notmatch '^4\.[0-9]+\.[0-9]+$') {
            throw 'minimum_godot_version must be an explicit Godot 4.x.y version.'
          }
          if ($env:REQUEST_SOURCE -ne 'evavo-development-studio') {
            throw 'Unsupported request_source.'
          }

      - name: Check out exact test-lab mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out test-lab commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $env:EXPECTED_SHA) {
            throw 'The checked-out test-lab SHA is not the requested SHA.'
          }
          git merge-base --is-ancestor $env:EXPECTED_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The requested SHA is not on test-lab main.'
          }

      - name: Verify native source toolchain authority
        shell: pwsh
        run: |
          py -3.11 scripts/check_repository_toolchain.py --native-family
          if ($LASTEXITCODE -ne 0) {
            throw 'Godot lab source toolchain validation failed.'
          }

      - name: Prepare isolated Python 3.11 environment
        id: python
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "godot-lab-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          py -3.11 -m venv $venv
          if ($LASTEXITCODE -ne 0) {
            throw 'Python 3.11 is unavailable on the native runner.'
          }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip --version
          if ($LASTEXITCODE -ne 0) {
            throw 'The Python 3.11 virtual environment has no usable pip.'
          }
          & $python -m pip install --disable-pip-version-check -e '.[dev,agent]'
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to install the pinned test-lab source.'
          }
          & $python scripts/check_repository_toolchain.py --native-family --installed
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed native toolchain validation failed.'
          }
          "python=$python" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve exact target and evidence paths
        id: paths
        shell: pwsh
        env:
          TARGET_REPOSITORY_PATH: ${{ inputs.target_repository_path }}
          PROJECT_SUBPATH: ${{ inputs.project_subpath }}
          PROFILE_PATH: ${{ inputs.profile_path }}
        run: |
          $targetRoot = (Resolve-Path $env:TARGET_REPOSITORY_PATH).Path
          $projectPath = if ($env:PROJECT_SUBPATH -eq '.') {
            $targetRoot
          } else {
            (Resolve-Path (Join-Path $targetRoot $env:PROJECT_SUBPATH)).Path
          }
          if (-not (Test-Path (Join-Path $projectPath 'project.godot') -PathType Leaf)) {
            throw 'The selected project_subpath does not contain project.godot.'
          }
          $nativeRoot = Join-Path $env:RUNNER_TEMP `
            "godot-native-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $validationRoot = Join-Path $env:RUNNER_TEMP `
            "godot-validation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $nativeRoot, $validationRoot -Force | Out-Null
          $profile = ''
          if ($env:PROFILE_PATH) {
            $profile = (Resolve-Path (Join-Path $targetRoot $env:PROFILE_PATH)).Path
          }
          "target_root=$targetRoot" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "project_path=$projectPath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "profile_path=$profile" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "native_root=$nativeRoot" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "native_artifacts=$(Join-Path $nativeRoot 'evidence')" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "validation_root=$validationRoot" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "validation_artifacts=$(Join-Path $validationRoot 'evidence')" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure checksum-verified managed Godot editor
        id: engine
        shell: pwsh
        env:
          PROJECT_PATH: ${{ steps.paths.outputs.project_path }}
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python }}
        run: |
          $engineRoot = Join-Path $env:LOCALAPPDATA 'EVAVO\GodotGameTestLab\engines'
          $receipt = Join-Path $env:RUNNER_TEMP `
            "managed-engine-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          & $env:PYTHON_EXECUTABLE -m godot_game_test_lab.cli engine ensure `
            $env:PROJECT_PATH --root $engineRoot --output $receipt
          if ($LASTEXITCODE -ne 0) {
            throw 'Managed Godot editor provisioning failed.'
          }
          $engine = Get-Content -Raw -LiteralPath $receipt | ConvertFrom-Json
          $executable = [string]$engine.installation.executable
          $flavor = [string]$engine.installation.flavor
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw 'Managed Godot executable receipt points to a missing file.'
          }
          "EVAVO_GODOT_HOME=$engineRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          if ($flavor -eq 'mono') {
            "GODOT_MONO_BIN=$executable" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "GODOT_BIN=$executable" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "engine_receipt=$receipt" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run bounded Godot native validation
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_ROOT: ${{ steps.paths.outputs.target_root }}
          PROJECT_SUBPATH: ${{ inputs.project_subpath }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          MINIMUM_GODOT_VERSION: ${{ inputs.minimum_godot_version }}
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python }}
          VALIDATION_ROOT: ${{ steps.paths.outputs.validation_root }}
          VALIDATION_ARTIFACTS: ${{ steps.paths.outputs.validation_artifacts }}
        run: |
          ./scripts/Invoke-GodotLabNativeValidation.ps1 `
            -TargetRepositoryPath $env:TARGET_ROOT `
            -ProjectSubpath $env:PROJECT_SUBPATH `
            -AllowedTargetRoots @('C:\GitRepos') `
            -ExpectedLabSha $env:EXPECTED_SHA `
            -ExpectedTargetSha $env:EXPECTED_TARGET_SHA `
            -ArtifactPath $env:VALIDATION_ARTIFACTS `
            -AllowedArtifactRoot $env:VALIDATION_ROOT `
            -PythonExecutable $env:PYTHON_EXECUTABLE `
            -MinimumGodotVersion $env:MINIMUM_GODOT_VERSION `
            -TimeoutSeconds 300 `
            -BootFrames 5

      - name: Retain managed engine receipt
        if: always()
        shell: pwsh
        env:
          ENGINE_RECEIPT: ${{ steps.engine.outputs.engine_receipt }}
          VALIDATION_ARTIFACTS: ${{ steps.paths.outputs.validation_artifacts }}
        run: |
          $destination = Join-Path $env:VALIDATION_ARTIFACTS 'managed-engine.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          if ($env:ENGINE_RECEIPT -and (Test-Path -LiteralPath $env:ENGINE_RECEIPT)) {
            Copy-Item -LiteralPath $env:ENGINE_RECEIPT -Destination $destination -Force
          }

      - name: Run native Windows visual and input journeys
        if: ${{ inputs.profile_path != '' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_ROOT: ${{ steps.paths.outputs.target_root }}
          PROJECT_SUBPATH: ${{ inputs.project_subpath }}
          PROFILE_PATH: ${{ steps.paths.outputs.profile_path }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          MINIMUM_GODOT_VERSION: ${{ inputs.minimum_godot_version }}
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python }}
          NATIVE_ROOT: ${{ steps.paths.outputs.native_root }}
          NATIVE_ARTIFACTS: ${{ steps.paths.outputs.native_artifacts }}
        run: |
          ./scripts/Invoke-GodotLabNativeAgentQA.ps1 `
            -TargetRepositoryPath $env:TARGET_ROOT `
            -ProjectSubpath $env:PROJECT_SUBPATH `
            -ProfilePath $env:PROFILE_PATH `
            -ExpectedLabSha $env:EXPECTED_SHA `
            -ExpectedTargetSha $env:EXPECTED_TARGET_SHA `
            -ArtifactPath $env:NATIVE_ARTIFACTS `
            -AllowedArtifactRoot $env:NATIVE_ROOT `
            -PythonExecutable $env:PYTHON_EXECUTABLE `
            -MinimumGodotVersion $env:MINIMUM_GODOT_VERSION `
            -TimeoutSeconds 900 `
            -BootFrames 30

      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-godot-validation-${{ inputs.expected_sha }}-${{ inputs.expected_target_sha }}
          path: ${{ steps.paths.outputs.validation_artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload bounded native agent evidence
        if: ${{ always() && inputs.profile_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-godot-agent-${{ inputs.expected_sha }}-${{ inputs.expected_target_sha }}
          path: ${{ steps.paths.outputs.native_artifacts }}
          if-no-files-found: error
          retention-days: 14
