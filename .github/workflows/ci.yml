name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate exact Godot lab source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Verify source toolchain authority
        run: python scripts/check_repository_toolchain.py

      - name: Run adversarial toolchain fixtures
        run: python scripts/test_repository_toolchain.py

      - name: Install bounded review-first dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Install the pinned MCP agent bridge
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[agent]"

      - name: Verify the installed MCP SDK identity
        run: python scripts/check_repository_toolchain.py --agent-installed

      - name: Build the root-restricted MCP server
        run: >-
          python -m godot_game_test_lab.mcp_server
          --lab-root .
          --allowed-root .
          --evidence-root "${RUNNER_TEMP}/godot-lab-mcp-evidence"
          --engine-root "${RUNNER_TEMP}/godot-lab-engines"
          --allow-noninteractive
          --self-test

      - name: Compile source, scripts and tests
        run: python -m compileall -q src scripts tests

      - name: Verify managed-engine lock and empty-cache commands
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m godot_game_test_lab.cli engine status \
            --root "${RUNNER_TEMP}/godot-lab-engines"
          status_code=$?
          set -e
          test "${status_code}" -eq 2
          python - <<'PY'
          from godot_game_test_lab.engine_manager import load_engine_lock
          lock = load_engine_lock()
          assert lock.minimum_version == "4.6.2"
          assert lock.default_version == "4.6.3"
          assert lock.channels == {"4.6": "4.6.3", "4.7": "4.7.1"}
          PY

      - name: Run Ruff and retain exact safe corrections
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src scripts tests --fix
          python -m ruff check src scripts tests
          root="${RUNNER_TEMP}/ruff-fixed"
          mkdir -p "${root}/files"
          git diff --name-only --diff-filter=AM > "${root}/manifest.txt"
          test -s "${root}/manifest.txt"
          while IFS= read -r file; do
            test -f "${file}"
            mkdir -p "${root}/files/$(dirname "${file}")"
            cp -- "${file}" "${root}/files/${file}"
          done < "${root}/manifest.txt"
          git diff --binary > "${root}/ruff-autofix.patch"
          git diff --check
          printf '%s\n' "${GITHUB_SHA}" > "${root}/source-sha.txt"

      - name: Upload read-only Ruff correction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-lab-ruff-autofix-${{ github.sha }}
          path: ${{ runner.temp }}/ruff-fixed
          if-no-files-found: error
          retention-days: 1

      - name: Parse shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts containers -type f -name '*.sh' -print0)

      - name: Parse PowerShell entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName))
          }

      - name: Run tests
        run: python -m pytest

      - name: Build wheel without dependency resolution
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Remove generated outputs and verify clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
