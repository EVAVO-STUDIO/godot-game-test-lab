[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "godot-game-test-lab"
version = "0.4.0"
description = "Automated Godot build, interaction, visual evidence and QA orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EVAVO Studio" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.3.0",
  "ruff==0.9.0",
]

[project.scripts]
godot-lab = "godot_game_test_lab.cli:main"
godot-lab-native-qa = "godot_game_test_lab.native_qa:main"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_game_test_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
