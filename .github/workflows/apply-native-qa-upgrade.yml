name: Apply native Godot QA upgrade

# The workflow is updated once after introduction so GitHub evaluates it from
# an already-present default-branch workflow definition.
on:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_native_qa_upgrade.py"
      - ".github/workflows/apply-native-qa-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-native-godot-qa-main
  cancel-in-progress: false

jobs:
  apply:
    name: Validate and publish native Godot QA upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact triggering main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11.15
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Reconstruct, verify and apply exact patch program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evavo
          exec > >(tee .evavo/native-qa-reconstruct.log) 2>&1
          cat .evavo/bootstrap/native-qa-upgrade-{00..04}.b64 \
            | base64 --decode > "${RUNNER_TEMP}/native-qa-upgrade.py.gz"
          printf '%s  %s\n' \
            '8f982bff1bbbbb9d32ca83b6a4e726a91a2df54cc8775be236b47c2fcd298347' \
            "${RUNNER_TEMP}/native-qa-upgrade.py.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout "${RUNNER_TEMP}/native-qa-upgrade.py.gz" \
            > scripts/apply_native_qa_upgrade.py
          printf '%s  %s\n' \
            '49cbdb86b82d01e8b5945535f512e83be5eba9ec0b16590896bb7f458068ad73' \
            'scripts/apply_native_qa_upgrade.py' \
            | sha256sum --check --strict
          python scripts/apply_native_qa_upgrade.py
          rm -f scripts/apply_native_qa_upgrade.py
          rm -f .evavo/bootstrap/native-qa-upgrade-*.b64
          rmdir .evavo/bootstrap 2>/dev/null || true
          rm -f .github/workflows/apply-native-qa-upgrade.yml
          rm -f .evavo/native-qa-bootstrap-diagnostic.txt

      - name: Verify repository-owned toolchain authority
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository_toolchain.py
          python scripts/test_repository_toolchain.py

      - name: Install pinned development dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Verify installed toolchain authority
        run: python scripts/check_repository_toolchain.py --installed

      - name: Compile, lint, parse and test the complete source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts containers -type f -name '*.sh' -print0)
          python -m pytest
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Clean generated files and verify the patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .pytest_cache .ruff_cache src/*.egg-info
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name '*.pyc' -delete
          rm -f .evavo/native-qa-reconstruct.log
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -E '^(\?\?| M|M |A | D|D ) (dist|\.pytest_cache|\.ruff_cache|src/.*\.egg-info|.*__pycache__|.*\.pyc)' || true)"

      - name: Commit the validated exact scope directly to main
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Remote main drifted from ${EXPECTED_HEAD} to ${remote_head}." >&2
            exit 1
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add --all
          git diff --cached --check
          git commit -m "feat(qa): add native Windows agent journeys and correct scene execution"
          git push origin HEAD:main

      - name: Retain bounded failure diagnostics
        if: failure()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set +e
          diagnostic='.evavo/native-qa-bootstrap-diagnostic.txt'
          mkdir -p .evavo
          {
            printf 'trigger_sha=%s\n' "${EXPECTED_HEAD}"
            printf 'utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n== reconstruction ==\n'
            cat .evavo/native-qa-reconstruct.log 2>/dev/null || true
            printf '\n== git status ==\n'
            git status --short --untracked-files=all
            printf '\n== git diff check ==\n'
            git diff --check
            printf '\n== repository toolchain ==\n'
            python scripts/check_repository_toolchain.py --skip-runtime
            printf '\n== compile ==\n'
            python -m compileall -q src scripts tests
            printf '\n== ruff ==\n'
            python -m ruff check src scripts tests
            printf '\n== pytest ==\n'
            python -m pytest -q
          } > "${diagnostic}" 2>&1
          git fetch --no-tags origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo "Not publishing diagnostics because main drifted to ${remote_head}."
            exit 0
          fi
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.com.au"
          git add "${diagnostic}"
          git commit -m "diagnose(qa): retain native QA bootstrap failure"
          git push origin HEAD:main
